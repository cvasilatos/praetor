site_name: Praetor
theme:
  name: readthedocs
  color_mode: dark


nav:
  - Home: index.md
  - API Reference:
    - Praetor: api/praetor.md

markdown_extensions:
  - admonition
  - pymdownx.snippets

plugins:
  - search
  - mkdocstrings:
        handlers:
          python:
            paths: ["src/praetor/"]
